[package]
name = "rust-order-book-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.2"
crossterm = "0.29"
futures-util = "0.3.34"
hmac = "0.13"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-arbitrary-precision"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5.0.3" }

[[bench]]
name = "to_units"
harness = false

[[bench]]
name = "serialize_units"
harness = false

[[bench]]
name = "mirror"
harness = false
