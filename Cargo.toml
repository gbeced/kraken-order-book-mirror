[package]
name = "rust-order-book-mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Mirrors Kraken's level3 (order-by-order) book over WebSocket v2 and shows it in a terminal dashboard"
license = "Apache-2.0"
repository = "https://github.com/gbeced/kraken-order-book-mirror"
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.2"
crossterm = "0.29"
futures-util = "0.3.34"
hmac = "0.13"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "query"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5.0.3" }
uuid = { version = "1.27.0", features = ["v4"] }

[[bench]]
name = "to_units"
harness = false

[[bench]]
name = "serialize_units"
harness = false

[[bench]]
name = "mirror"
harness = false
