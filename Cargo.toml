[package]
name = "rust-order-book-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
hmac = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tungstenite = { version = "0.30", features = ["native-tls"] }